name: Testversion 2 – Spiel veröffentlichen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: testversion-2-package
  cancel-in-progress: true
jobs:
  package:
    if: github.repository == 'lukassmolenski-prog/tom-hengst-testversion-2' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Abhängigkeiten installieren
        run: npm ci --prefix testversion-2/runtime --no-audit --no-fund
      - name: Modelle und Sounds laden
        run: node testversion-2/fetch-assets.cjs
      - name: Paket und Koop prüfen
        run: node testversion-2/verify-package.cjs
      - name: Online-Spiel bauen
        run: node testversion-2/build-web.cjs
      - name: Webseite für GitHub Pages bereitstellen
        uses: actions/upload-pages-artifact@v4
        with:
          path: testversion-2/web
      - name: Startpaket bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: tom-hengst-testversion-2
          retention-days: 90
          if-no-files-found: error
          path: |
            testversion-2/*.js
            testversion-2/*.cjs
            testversion-2/*.html
            testversion-2/*.css
            testversion-2/*.cmd
            testversion-2/*.md
            testversion-2/assets-manifest.json
            testversion-2/package-check.json
            testversion-2/assets/game/
            testversion-2/runtime/package.json
            testversion-2/runtime/package-lock.json
            testversion-2/runtime/node_modules/three/
            testversion-2/runtime/node_modules/ws/
  deploy:
    if: github.repository == 'lukassmolenski-prog/tom-hengst-testversion-2' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages-Einstellung prüfen
        uses: actions/configure-pages@v5
      - name: Spiel veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
